name: Fast-forward upstream sync

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-candidate:
    name: Validate exact upstream candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.state.outputs.changed }}
      base_sha: ${{ steps.state.outputs.downstream }}
      synced_sha: ${{ steps.state.outputs.upstream }}
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/apollo_test?sslmode=disable
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: apollo_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d apollo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    steps:
      - name: Check out the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.24.x
          cache: true

      - name: Resolve safe synchronization state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          git remote add authoritative-upstream https://github.com/Apollo-Reborn/apollo-backend.git
          git fetch --no-tags authoritative-upstream \
            +refs/heads/main:refs/remotes/authoritative-upstream/main
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          downstream=$(git rev-parse refs/remotes/origin/main)
          upstream=$(git rev-parse refs/remotes/authoritative-upstream/main)
          {
            echo "downstream=$downstream"
            echo "upstream=$upstream"
          } >> "$GITHUB_OUTPUT"

          state=$(bash scripts/upstream-sync-state.sh "$downstream" "$upstream")
          echo "state=$state" >> "$GITHUB_OUTPUT"
          case "$state" in
            equal|upstream-contained)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Fork main already contains upstream main ($state); no changes needed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            fast-forward)
              ;;
            diverged)
              echo "::error::Both branches have unique history; reconcile through review."
              {
                echo "## Upstream sync stopped"
                echo
                echo "Fork and upstream main have diverged."
                echo "No repository refs were changed. Reconcile the divergence through review."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            *)
              echo "::error::Unexpected synchronization state: $state"
              exit 1
              ;;
          esac

          git switch --force-create sync-candidate "$downstream"
          git merge --ff-only "$upstream"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Validate upstream candidate
        if: steps.state.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          psql -v ON_ERROR_STOP=1 -f docs/schema.sql "$DATABASE_URL"
          go test -count=1 -race -timeout 5m ./...
          go vet ./...
          go build -trimpath ./cmd/apollo
          docker build --check .

  finalize:
    name: Fast-forward main to the validated SHA
    needs: [validate-candidate, validate-candidate-image]
    if: needs.validate-candidate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BASE_SHA: ${{ needs.validate-candidate.outputs.base_sha }}
      UPSTREAM_SHA: ${{ needs.validate-candidate.outputs.synced_sha }}
    steps:
      - name: Check out the exact validated base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-candidate.outputs.base_sha }}
      - name: Fast-forward fork main without executing candidate code
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          actual_downstream=$(git rev-parse refs/remotes/origin/main)
          if [[ "$actual_downstream" != "$BASE_SHA" ]]; then
            echo "::error::Fork main advanced during validation; refusing to push."
            exit 1
          fi
          git fetch --no-tags https://github.com/Apollo-Reborn/apollo-backend.git "$UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$UPSTREAM_SHA"
          git push origin "$UPSTREAM_SHA:refs/heads/main"

  validate-candidate-image:
    name: Validate exact candidate image without publishing
    needs: validate-candidate
    if: needs.validate-candidate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # GITHUB_TOKEN pushes do not trigger the push-based Docker workflow.
      # Check the exact validated commit explicitly, without registry credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-candidate.outputs.synced_sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

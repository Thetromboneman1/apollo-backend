version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - errname
    - gochecknoinits
    - importas
    - noctx
    - paralleltest
    - prealloc
    - rowserrcheck
    - sqlclosecheck
    - testpackage
    - thelper
    - unconvert
    - unparam
    - usetesting
  disable:
    - govet
    - staticcheck
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - paralleltest
        text: does not use range value in test Run
      - linters:
          - unparam
        path: internal/api/accounts.go
        text: registerAccount - result 0 .* is never used
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

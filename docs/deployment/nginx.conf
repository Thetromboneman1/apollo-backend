worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log off;
  error_log /dev/stderr warn;
  server_tokens off;

  # The gateway is published on loopback only, so Cloudflare Tunnel is the
  # only remote ingress allowed to supply CF-Connecting-IP. Direct local
  # checks fall back to the socket peer.
  map $http_cf_connecting_ip $apollo_client_key {
    "~^[0-9A-Fa-f:.]{2,45}$" $http_cf_connecting_ip;
    default $binary_remote_addr;
  }
  map $http_cf_connecting_ip $apollo_forwarded_for {
    "~^[0-9A-Fa-f:.]{2,45}$" $http_cf_connecting_ip;
    default $remote_addr;
  }

  client_max_body_size 1m;
  client_body_timeout 15s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  send_timeout 30s;

  limit_req_zone $apollo_client_key zone=apollo_rate:10m rate=20r/s;
  limit_conn_zone $apollo_client_key zone=apollo_connections:10m;

  server {
    listen 8080;

    location = /v1/health {
      limit_req zone=apollo_rate burst=40 nodelay;
      limit_conn apollo_connections 20;

      proxy_pass http://api:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $apollo_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      limit_req zone=apollo_rate burst=40 nodelay;
      limit_conn apollo_connections 20;

      proxy_pass http://api:4000;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 30s;
      proxy_request_buffering on;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $apollo_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
